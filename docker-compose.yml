version: "3.9"

services:
  podcast-agent:
    build: .
    container_name: podcast-agent
    ports:
      - "8765:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped

